# Actualización diaria de datos desde laliganacional.com.ar.
# Corre todos los días a las 07:17 (hora argentina), después de los partidos de la noche.
# También se puede lanzar a mano: pestaña Actions -> "Sincronizar datos LNB" -> Run workflow.
name: Sincronizar datos LNB
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 07:17 Argentina
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync-datos
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Pruebas del pipeline
        working-directory: pipeline
        run: python -m pytest -q
      - name: Sincronizar (temporada en curso)
        working-directory: pipeline
        env:
          TZ: America/Argentina/Buenos_Aires
        run: python -m lnbstats.cli sync
      - name: Guardar cambios en el repositorio
        id: commit
        run: |
          git config user.name "lnb-stats-bot"
          git config user.email "lnb-stats-bot@users.noreply.github.com"
          git add data/lnb.sql web/public/data/real.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Datos: sincronización automática $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  publicar:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
