# Actualización de datos desde laliganacional.com.ar, cuatro veces por día.
# GitHub puede demorar varias horas las tareas programadas cuando tiene mucha carga: con cuatro
# horarios, los resultados de la noche entran a primera hora aunque alguna corrida se atrase.
# Cada corrida hace ~15 pedidos al sitio (sólo partidos nuevos o recientes).
# También se puede lanzar a mano: pestaña Actions -> "Sincronizar datos LNB" -> Run workflow.
name: Sincronizar datos LNB
on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # 02:17, 08:17, 14:17 y 20:17 hora argentina
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync-datos
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Pruebas del pipeline
        working-directory: pipeline
        run: python -m pytest -q
      - name: Sincronizar (temporada en curso)
        working-directory: pipeline
        env:
          TZ: America/Argentina/Buenos_Aires
        run: python -m lnbstats.cli sync
      - name: Guardar cambios en el repositorio
        id: commit
        run: |
          git config user.name "lnb-stats-bot"
          git config user.email "lnb-stats-bot@users.noreply.github.com"
          git add data/lnb.sql web/public/data/real.json web/public/escudos
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Datos: sincronización automática $(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  publicar:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
