# Publica la web en GitHub Pages: https://luxemrose.github.io/lnb-stats/
# Requisito (una sola vez): Settings -> Pages -> Source: "GitHub Actions".
name: Publicar web
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # al llamarse desde la sincronización, toma los datos recién guardados
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # APK de prueba descargable desde el sitio (descargas/lnb-stats.apk). Si falla, la web se publica igual.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
        continue-on-error: true
      - name: APK de prueba para Android
        continue-on-error: true
        working-directory: web
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          npx cap sync android
          (cd android && ./gradlew assembleDebug -PlnbVersionCode=${{ github.run_number }} -PlnbVersionName=1.0.${{ github.run_number }})
          mkdir -p dist/descargas
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/descargas/lnb-stats.apk
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
