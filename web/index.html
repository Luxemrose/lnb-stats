<!doctype html>
<html lang="es-AR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LNB Stats</title>
    <meta name="description" content="Estadísticas y análisis de la Liga Nacional de Básquet (Argentina): jugadores, equipos, partidos y comparaciones." />
    <meta name="theme-color" content="#10141D" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2310141D'/><circle cx='16' cy='16' r='9.5' fill='none' stroke='%23FF8A35' stroke-width='2.4'/><path d='M6.5 16h19M16 6.5v19' stroke='%23FF8A35' stroke-width='1.8'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema guardado antes de pintar (evita un destello de color al cargar).
      (function () {
        try {
          var t = localStorage.getItem("lnb-theme") || "dark";
          if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        } catch (e) { /* sin almacenamiento: queda el tema oscuro */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
